<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punzonatura barre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0d0f11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<script src="lib/supabase.js"></script>
<script src="lib/JsBarcode.all.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<style>
/*
VOICE: control room di reparto — asciutto, leggibile coi guanti, nessun ornamento.
IDEA: il cartellino di produzione che accompagna il fascio di barre.
PICTURE: i due barcode Code 128 su fondo bianco, grandi, sono l'oggetto centrale.
COLOUR and TYPE: pannello acciaio, nero, bianco, rosso allarme; Inter Tight + Inter.
LAYOUT: una colonna di lavoro a passi numerati; registro e ordini come tabelle.
*/
:root{color-scheme:light dark;
--bg:light-dark(#d5dbe0,#16191c);--panel:light-dark(#ffffff,#21262b);--ink:light-dark(#0d0f11,#eef1f3);
--mute:light-dark(#56606a,#9aa5ae);--line:light-dark(#b9c2c9,#343b42);--red:#e8251a;--redbg:light-dark(#fde4e2,#3a1714);
--warn:light-dark(#fff3c4,#3a3113);--okbg:light-dark(#0d0f11,#eef1f3);--okink:light-dark(#ffffff,#0d0f11)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(24px,4vw,34px)}h2{font-size:22px}h3{font-size:17px}
header{background:var(--ink);color:var(--bg);padding:14px max(4vw,16px);display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
header h1{color:light-dark(#fff,#16191c)}
.who{font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;font-weight:600;background:var(--red);color:#fff}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:0 max(4vw,16px);background:var(--ink)}
nav a{flex:none;color:light-dark(#c9d0d6,#4a535b);text-decoration:none;padding:10px 16px;font-weight:600;border-radius:8px 8px 0 0}
nav a.on{background:var(--bg);color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:24px max(4vw,16px) 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,3vw,24px);margin-bottom:16px}
.step{display:flex;gap:12px;align-items:baseline;margin-bottom:12px}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-weight:700;font-family:"Inter Tight"}
.num.done{background:var(--red)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input[type=text],input[type=search],input[type=date],select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:light-dark(#f6f8f9,#16191c);color:var(--ink);min-height:46px}
input:focus-visible,button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left}input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.big{font-size:22px!important;font-family:"Inter Tight";letter-spacing:.02em;text-transform:uppercase}
button,.btn{font:inherit;font-weight:600;min-height:46px;padding:10px 18px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}button.red{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 16px}.full{grid-column:1/-1}
.kv span{display:block;font-size:13px;color:var(--mute)}.kv b{display:block;font-size:18px;font-family:"Inter Tight";overflow-wrap:anywhere;line-height:1.2}
.kv.hl{grid-column:1/-1}.kv.hl b{font-size:26px}
.hits{display:grid;gap:6px;margin-top:10px}
.hit{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.hit b{font-family:"Inter Tight"}
.msg{padding:12px 14px;border-radius:8px;margin:12px 0;font-weight:500}
.msg.err{background:var(--redbg);border-left:5px solid var(--red)}
.msg.warn{background:var(--warn);border-left:5px solid #c79a00}
.msg.ok{background:var(--okbg);color:var(--okink)}
.msg.info{background:light-dark(#eef1f3,#1b1f23);border-left:5px solid var(--mute)}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:500;margin:12px 0;cursor:pointer}
.check input{width:24px;height:24px;flex:none;accent-color:var(--red);margin-top:1px}
.codes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:8px}
.code{background:#fff;color:#000;border-radius:10px;padding:14px;border:2px solid #000}
.code p{margin:0 0 6px;font-weight:700;font-family:"Inter Tight";font-size:15px}
.code svg{display:block;width:100%;height:auto}
.thumb{max-width:220px;max-height:160px;border-radius:8px;border:1px solid var(--line);display:block;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n{text-align:right;white-space:nowrap}td.t{white-space:nowrap}td{overflow-wrap:anywhere}
tr.ann td{opacity:.5;text-decoration:line-through}tr.ann td.keep{text-decoration:none;opacity:1}
.mute{color:var(--mute);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--red);width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.stats div{background:light-dark(#eef1f3,#16191c);border-radius:8px;padding:10px 12px}.stats b{display:block;font-size:24px;font-family:"Inter Tight"}
dialog{border:none;border-radius:12px;padding:22px;max-width:440px;width:92vw;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:#0009}
.hidden{display:none!important}
.hbtn{min-height:36px;padding:4px 12px;font-size:14px;background:transparent;border:1px solid currentColor;color:inherit;margin-left:4px}
.login{max-width:420px;margin:24px auto}
.obbar{background:#c79a00;color:#000;font-weight:600;text-align:center;padding:8px 12px;font-size:14px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{display:inline-flex;align-items:center;justify-content:center;margin:0;font-size:16px;color:var(--panel)}label.btn.ghost{background:transparent;color:var(--ink)}
.fbtn{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}.fbtn .mute{min-width:7.5em}
input[type=file]{font:inherit;font-size:15px;max-width:100%}
input[type=file]::file-selector-button{font:inherit;font-weight:600;min-height:44px;padding:8px 16px;margin-right:10px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer}
.lbl{font-weight:600;font-size:14px;margin:12px 0 6px}
body.full header,body.full nav,body.full #diag,body.full #demo,body.full #toast{display:none!important}
body.full{background:#fff;color:#000}body.full main{max-width:none;padding:0}
.fs{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#fff;color:#000;padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.fsbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}
.fsbar button{color:#000;border-color:#000;background:#fff;min-height:44px;padding:6px 14px}
.fscodes{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:14px;padding:12px 0}
.fscode{display:flex;flex-direction:column;gap:6px}.fscode p{margin:0;font:600 16px Inter,sans-serif;letter-spacing:.02em}.fscode p b{font:700 24px "Inter Tight",Inter,sans-serif;margin-left:6px}
.fscode svg{display:block;width:100%;height:min(26vh,190px)}
.fsdone{min-height:64px;font-size:19px;width:100%}
@media(orientation:landscape) and (max-height:600px){.fscodes{flex-direction:row}.fscode{flex:1}.fscode svg{height:min(50vh,190px)}}
.big-btn{min-height:56px;font-size:18px;padding:12px 22px}
.demo{background:var(--red);color:#fff;text-align:center;padding:6px;font-size:14px;font-weight:600}
pre,.scroll{overflow-x:auto}
@media(max-width:600px){nav a{padding:9px 11px;font-size:15px}header{padding-block:10px}main{padding-top:16px}th,td{padding:7px 5px}.kv.hl b{font-size:22px}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.fade{animation:f .25s ease-out}@keyframes f{from{opacity:0;transform:translateY(6px)}}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div id="diag" class="demo hidden">Il tuo utente è in sola lettura: puoi consultare ma non salvare.</div>
<header><h1>Punzonatura barre</h1><div class="who"><span id="me">Connessione…</span><span id="role" class="badge hidden"></span><span id="hdrBtns" class="hidden"><button class="hbtn" id="pinBtn">Cambia PIN</button><button class="hbtn" id="logout">Esci</button></span></div></header>
<nav id="nav"></nav><div id="ob" class="obbar hidden" role="status"></div>
<main id="view"><div class="card">Caricamento…</div></main>
<dialog id="dlg"><h3 id="dlgT"></h3><p id="dlgP" class="mute"></p><label for="dlgI" id="dlgL" class="hidden">Motivo</label><input type="text" id="dlgI" class="hidden"><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="ghost" id="dlgNo">Annulla</button><button class="red" id="dlgOk">Conferma</button></div></dialog>

<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').trim().toUpperCase();
const fmtT=ms=>ms?new Date(ms).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const fmtN=v=>v===''||v==null?'':Number(v).toLocaleString('it-IT');

/* ---------- stato ---------- */
const S={db:null,user:null,assets:null,downloads:null,demo:false,me:{id:'',name:''},role:'operatore',
  ordini:new Map(),ordLoaded:false,punz:[],punzLimit:300,cfg:{fotoObbligatoria:false},compat:[],names:{},
  outbox:[],lastImp:null,sample:null,lett:null,leggendo:false,sel:null,prev:[],colataLetta:'',chkProf:false,chkAgain:false,foto:null,fotoUrl:'',saving:false,done:null,q:'',
  V:{sel:null,prev:[],lett:null,lega:'',colata:'',lung:'',prof:'',q:'',leggendo:false,saving:false,saved:null},ctrl:[],ctrlLimit:300,rTab:'punz',imp:null,impBusy:false,impProg:0,rq:'',rFrom:'',rTo:'',rUser:'',oq:''};

const routes=()=>S.role==='admin'?[['punzona','Punzona'],['verifica','Verifica'],['registro','Registro'],['ordini','Dati']]:S.role==='lettore'?[['registro','Registro'],['verifica','Verifica']]:[['punzona','Punzona'],['verifica','Verifica'],['mie','Le mie punzonature']];
const cur=()=>{const h=location.hash.slice(1);const r=routes().map(x=>x[0]);return r.includes(h)?h:r[0]};

/* ---------- regole di verifica ---------- */
function legheDiColata(col){
  const s=new Set();for(const o of S.ordini.values())if(o.colata===col)s.add(o.lega);
  return s;
}
function compatOk(col,lega){return S.compat.some(c=>c.colata===col&&c.lega===lega)}
function conflittoLega(o){
  const s=[...legheDiColata(o.colata)].filter(l=>l!==o.lega&&!compatOk(o.colata,l)&&!compatOk(o.colata,o.lega));
  return s;
}

/* ---------- render ---------- */
function render(){
  const a=document.activeElement,fid=a&&a.id&&a.tagName==='INPUT'&&a.type!=='file'&&a.type!=='checkbox'?a.id:'',sel=fid&&a.type!=='date'?[a.selectionStart,a.selectionEnd]:null;
  paint();
  if(fid){const n=document.getElementById(fid);if(n){n.focus();if(sel)try{n.setSelectionRange(sel[0],sel[1])}catch{}}}
}
/* aggiorna solo ciò che cambia: il campo in cui si sta scrivendo non viene ricreato (la tastiera resta com'è) */
function patch(el,html){const t=document.createElement('div');t.innerHTML=html;morph(el,t)}
function morph(a,b){
  const ac=[...a.childNodes],bc=[...b.childNodes];
  for(let i=0;i<bc.length;i++){
    const n=bc[i],o=ac[i];
    if(!o){a.appendChild(n);continue}
    if(o.nodeType!==n.nodeType||o.nodeName!==n.nodeName||(o.nodeType===1&&(o.id!==n.id||o.namespaceURI==='http://www.w3.org/2000/svg'||(o.tagName==='INPUT'&&o.type!==n.type)))){a.replaceChild(n,o);continue}
    if(o.nodeType!==1){if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;continue}
    for(const at of [...o.attributes])if(!n.hasAttribute(at.name)&&at.name!=='data-l')o.removeAttribute(at.name);
    for(const at of [...n.attributes])if(o.getAttribute(at.name)!==at.value)o.setAttribute(at.name,at.value);
    if(o.tagName==='INPUT'){
      if(o.type==='checkbox')o.checked=n.hasAttribute('checked');
      else if(o.type!=='file'&&o!==document.activeElement){const v=n.getAttribute('value')??'';if(o.value!==v)o.value=v}
      continue;
    }
    morph(o,n);
    if(o.tagName==='SELECT'){const i2=[...n.options].findIndex(x=>x.hasAttribute('selected'));o.selectedIndex=i2<0?0:i2}
  }
  for(let i=ac.length-1;i>=bc.length;i--)if(ac[i].parentNode===a)a.removeChild(ac[i]);
}
function paint(){
  if(cur()==='ordini'&&S.role==='admin'&&!S.utentiLoading){S.utentiLoading=true;loadUtenti()}
  const ob=$('#ob');if(ob){ob.classList.toggle('hidden',!S.outbox.length);ob.textContent=S.outbox.length?`Senza rete: ${S.outbox.length} ${S.outbox.length>1?'salvataggi':'salvataggio'} in attesa di invio. Non chiudere la pagina.`:''}
  const r=cur();if(S.full&&r!=='punzona')exitFull();
  patch($('#nav'),routes().map(([k,t])=>`<a href="#${k}" class="${k===r?'on':''}">${t}</a>`).join(''));
  patch($('#view'),r==='punzona'?vPunzona():r==='registro'||r==='mie'?vRegistro(r==='mie'):r==='verifica'?vVerifica():vOrdini());
  if(r==='punzona')drawCodes();
}

function vPunzona(){
  if(S.full&&S.sel)return vFull();
  if(S.done)return`<div class="card fade">${S.done.annullato?`<div class="msg err">Punzonatura dell'ODP ${esc(S.done.odp)} annullata: ${esc(S.done.annullato.motivo)}.</div>`:S.done.queued?`<div class="msg warn">Nessuna rete: punzonatura dell'ODP ${esc(S.done.odp)} salvata sul telefono alle ${esc(fmtT(S.done.tsMs))}. Verrà inviata appena torna la connessione: non chiudere la pagina finché non è inviata.</div>`
    :`<div class="msg ok">Registrato: ODP ${esc(S.done.odp)} punzonato e verificato alle ${esc(fmtT(S.done.tsMs))}.</div>`}
    <div class="grid"><div class="kv"><span>Lega</span><b>${esc(S.done.lega)}</b></div><div class="kv"><span>Colata</span><b>${esc(S.done.colata)}</b></div></div>
    <div class="row" style="margin-top:18px"><button id="again">Nuovo ordine</button>${!S.done.queued&&canAnn(S.done)?`<button class="ghost" data-ann="${esc(S.done.id)}">Annulla (errore)</button>`:''}</div>
    ${!S.done.queued&&canAnn(S.done)&&S.role!=='admin'?'<p class="mute">Puoi annullarla tu entro 5 minuti; dopo solo il responsabile.</p>':''}</div>`;
  if(!S.ordLoaded)return`<div class="card">Caricamento ordini…</div>`;
  if(!S.ordini.size)return`<div class="card"><h2>Nessun ordine caricato</h2><p class="mute">${S.role==='admin'?'Vai su "Ordini e dati" e carica l\'export Excel del gestionale.':'Chiedi al responsabile di caricare l\'export del gestionale.'}</p></div>`;
  const o=S.sel;
  let h=`<div class="card"><div class="step"><div class="num ${o?'done':''}">1</div><h2>Ordine di produzione</h2></div>`;
  if(!o){
    const q=norm(S.q),hits=q.length<2?[]:[...S.ordini.values()].filter(x=>x.odp.toUpperCase().includes(q)||x.colata.includes(q)||String(x.profilo).toUpperCase().includes(q)).slice(0,12);
    h+=`<label for="q">Cerca ODP (anche solo il numero, es. 8099)</label><input id="q" type="search" class="big" autocomplete="off" inputmode="decimal" value="${esc(S.q)}" placeholder="2026.2.…">
    <div class="hits">${hits.map(x=>`<button class="hit" data-odp="${esc(x.odp)}"><b>${esc(x.odp)}</b><span>${esc(x.profilo)} · ${esc(fmtN(x.lunghezza))} mm · ${esc(x.lega)}</span></button>`).join('')}</div>
    ${q.length>=2&&!hits.length?'<div class="msg info">Nessun ordine trovato. Se è nuovo, va ricaricato l\'export dal gestionale.</div>':''}${vImp()}
    <p class="lbl">Oppure scatta una foto all'etichetta: l'app legge i dati da sola</p>${fotoBtns('foto1')}
    ${S.fotoUrl?`<img class="thumb" src="${esc(S.fotoUrl)}" alt="Foto etichetta">`:''}
    ${S.leggendo?'<div class="msg info">Lettura etichetta in corso… (la prima volta può servire mezzo minuto)</div>':''}
    ${S.lett&&S.lett.err?`<div class="msg err">${esc(S.lett.err)}</div>`:''}</div>`;
    return h;
  }
  const conf=conflittoLega(o),prev=S.prev.filter(p=>!p.annullato);
  h+=`<div class="grid fade"><div class="kv hl"><span>ODP</span><b>${esc(o.odp)}</b></div><div class="kv"><span>Profilo</span><b>${esc(o.profilo)}</b></div>
   <div class="kv"><span>Lunghezza</span><b>${esc(fmtN(o.lunghezza))} mm</b></div><div class="kv"><span>Pezzi</span><b>${esc(fmtN(o.pezzi))}</b></div>
   <div class="kv full"><span>Cliente</span><b style="font-size:15px">${esc(o.cliente)}</b></div></div>
   ${o.nota?`<div class="msg info">${esc(o.nota)}</div>`:''}
   ${conf.length?`<div class="msg err">Attenzione: la colata ${esc(o.colata)} risulta anche su altre leghe (${conf.map(esc).join(', ')}). Avvisa il responsabile prima di punzonare.</div>`:''}
   ${prev.length?`<div class="msg warn">Questo ODP è già stato punzonato ${prev.length} ${prev.length>1?'volte':'volta'}, l'ultima il ${esc(fmtT(prev[0].tsMs))} da ${esc(nm(prev[0].uid))}.
     <label class="check"><input type="checkbox" id="chkAgain" ${S.chkAgain?'checked':''}> Confermo che serve una nuova punzonatura (es. barre aggiuntive)</label></div>`:''}
   <div class="row" style="margin-top:12px"><button class="ghost" id="chg">Cambia ordine</button></div></div>`;
  const colOk=S.colataLetta&&norm(S.colataLetta)===o.colata, colKo=S.colataLetta&&norm(S.colataLetta).length>=o.colata.length&&!colOk;
  h+=`<div class="card"><div class="step"><div class="num ${colOk&&S.chkProf?'done':''}">2</div><h2>Verifica materiale</h2></div>
   <label for="col">Colata letta sull'etichetta del materiale</label><input id="col" type="text" class="big" autocomplete="off" autocapitalize="characters" value="${esc(S.colataLetta)}" placeholder="es. 526027A3">
   ${colOk?'<div class="msg ok">✓ La colata corrisponde all\'ordine.</div>':colKo?`<div class="msg err">La colata non corrisponde all'ordine. Non punzonare e verifica con il responsabile.</div>`:''}
   <label class="check"><input type="checkbox" id="chkProf" ${S.chkProf?'checked':''}> Profilo ${esc(o.profilo)} e lunghezza ${esc(fmtN(o.lunghezza))} mm corrispondono al materiale</label>
   <p class="lbl">Foto dell'etichetta ${S.cfg.fotoObbligatoria?'(obbligatoria)':'(facoltativa)'}</p>
   ${fotoBtns('foto')}
   ${S.fotoUrl?`<img class="thumb" src="${esc(S.fotoUrl)}" alt="Foto etichetta">`:''}

/* ---------- import excel ---------- */
function parseExcel(buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
  if(!rows.length)return{err:'Il file è vuoto.'};
  const keys=Object.keys(rows[0]),find=n=>keys.find(k=>k.trim().toLowerCase()===n);
  const K={odp:find('odp'),lotto:find('lotto'),lega:find('des. lega'),cod:find('cod. lega'),prof:find('profilo'),len:find('lunghezza'),cli:find('rag. soc. cliente'),pz:find('qta pezzi'),pr:find('cod. pressa')};
  const miss=['odp','lotto','lega'].filter(k=>!K[k]);
  if(miss.length)return{err:'Colonne mancanti nel file: '+miss.map(k=>({odp:'ODP',lotto:'Lotto',lega:'Des. lega'})[k]).join(', ')};
  const out=new Map(),anom=[],note=[];let scartati=0;
  for(const r of rows){
    const odp=String(r[K.odp]).trim(),lotto=String(r[K.lotto]).trim(),parts=lotto.split('-');
    if(!odp)continue;
    if(parts.length<3){scartati++;continue}
    const colata=norm(parts[1]),lega=norm(r[K.lega]);
    if(!/^[0-9A-Z]{5,12}$/.test(colata)){anom.push(`ODP ${odp}: colata "${colata}" in formato non previsto (lotto ${lotto})`);continue}
    if(!lega){anom.push(`ODP ${odp}: lega mancante`);continue}
    if(!/^[0-9A-Za-z._:@+~-]+$/.test(odp)){anom.push(`ODP ${odp}: formato non valido`);continue}
    if(out.has(odp))anom.push(`ODP ${odp} presente più volte nel file: tenuta l'ultima riga`);
    let nota='';const ln=(parts[0].split('.')[1]||''),on=(odp.split('.')[2]||'');
    if(ln&&on&&ln!==on){nota=`Billette riassegnate: il lotto viene dall'ODP ${parts[0]}.`;note.push(`ODP ${odp}: lotto ${lotto}`)}
    out.set(odp,{odp,colata,lega,codLega:norm(K.cod?r[K.cod]:''),profilo:String(K.prof?r[K.prof]:'').trim(),lunghezza:Number(K.len?r[K.len]:'')||'',
      pezzi:Number(K.pz?r[K.pz]:'')||'',cliente:String(K.cli?r[K.cli]:'').trim(),pressa:(String(K.pr?r[K.pr]:'').match(/P(\d{4})/i)||[])[1]||'',lotto,nota});
  }
  // colata → leghe, su database + file
  const merged=new Map([...S.ordini,...out]),m=new Map();
  for(const o of merged.values()){if(!m.has(o.colata))m.set(o.colata,new Set());m.get(o.colata).add(o.lega)}
  for(const[c,s]of m)if(s.size>1){const l=[...s];if(!l.every(x=>l.every(y=>x===y||compatOk(c,x)||compatOk(c,y))))anom.push(`Colata ${c} associata a più leghe: ${l.join(', ')}`)}
  let nuovi=0,agg=0,uguali=0;const scrivi=[];
  for(const o of out.values()){const e=S.ordini.get(o.odp);
    if(!e){nuovi++;scrivi.push(o)}else if(JSON.stringify(e)!==JSON.stringify({...e,...o})){agg++;scrivi.push(o);if(e.colata!==o.colata)anom.push(`ODP ${o.odp}: colata cambiata da ${e.colata} a ${o.colata}`)}else uguali++}
  const rimuovi=[...S.ordini.keys()].filter(k=>!out.has(k));
  return{nuovi,agg,uguali,scartati,anom,note,scrivi,rimuovi,daRimuovere:rimuovi.length,prune:false};
}
async function runImport(){
  const im=S.imp;if(!im||S.impBusy)return;S.impBusy=true;S.impProg=0;render();
  const bulk=!!S.db.bulkSet,tot=im.scrivi.length+(im.prune?im.rimuovi.length:0);
  const jobs=[...(bulk?[]:im.scrivi.map(o=>()=>S.db.doc('ordini/'+o.odp).set({...o,aggiornato:Date.now()}))),...(im.prune?im.rimuovi.map(k=>()=>S.db.doc('ordini/'+k).delete()):[])];
  let i=0,done=0,fail=0;
  const bar=()=>{S.impProg=Math.round(done/Math.max(1,tot)*100);const b=document.querySelector('.bar i');if(b)b.style.width=S.impProg+'%'};
  if(bulk&&im.scrivi.length){
    try{await S.db.bulkSet('ordini',im.scrivi.map(o=>[o.odp,{...o,aggiornato:Date.now()}]),n=>{done=n;bar()})}
    catch(e){fail+=im.scrivi.length-done;console.warn(e)}}
  const worker=async()=>{while(i<jobs.length){const j=jobs[i++];try{await j()}catch(e){if(e?.code==='unavailable'){await new Promise(r=>setTimeout(r,800));try{await j()}catch{fail++}}else fail++}
    done++;bar()}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  S.ordForce=true;
  if(done>fail)try{await S.db.doc('config/import').set({tsMs:Date.now(),uid:S.me.id,ordini:S.ordini.size})}catch(e){console.warn(e)}
  S.impBusy=false;S.imp=fail?{err:`${fail} scritture non riuscite su ${tot}. Riprova a caricare il file.`}:null;
  toast(fail?'':`Caricati ${tot} aggiornamenti.`);render();
}

async function resizePhoto(file){
  const img=await createImageBitmap(file),k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);

/* Supabase restituisce al massimo 1000 righe per richiesta: si legge a blocchi */
async function leggiTutto(build,max){
  const out=[];
  for(let a=0;;a+=1000){const n=max?Math.min(1000,max-a):1000;if(n<=0)break;
    const{data,error}=await build().range(a,a+n-1);if(error)throw dbErr(error);out.push(...data);if(data.length<n)break}

}

async function leggiOrdini(){
  if(!ORD.rows){const c=ordCacheLoad();if(c){ORD.rows=c.rows;ORD.max=c.max}}
  const sel=()=>sb.from('ordini').select('id,data,aggiornato');
  if(!ORD.rows||!ORD.full||S.ordForce||Date.now()-ORD.full>15*60e3){
    S.ordForce=false;const d=await leggiTutto(()=>sel().order('id'));
    ORD.rows=new Map(d.map(r=>[r.id,r.data]));ORD.max=d.reduce((m,r)=>r.aggiornato>m?r.aggiornato:m,'');ORD.full=Date.now();
  }else{
    const d=await leggiTutto(()=>sel().gt('aggiornato',ORD.max).order('id'));
    for(const r of d){ORD.rows.set(r.id,r.data);if(r.aggiornato>ORD.max)ORD.max=r.aggiornato}
  }

function sbQuery(t,f=[],ord=null,lim=null){
  const key=JSON.stringify([t,f,ord,lim]),isOrd=t==='ordini'&&!f.length&&!ord&&!lim,cacheable=t==='config';
  async function run(){
    if(isOrd)return leggiOrdini();
    const build=()=>{let q=sb.from(t).select('id,data');
      for(const[fl,,v]of f)q=q.eq('data->>'+fl,String(v));
      q=ord?q.order('data->'+ord[0],{ascending:ord[1]!=='desc'}).order('id'):q.order('id');return q};
    const data=await leggiTutto(build,lim);
    const rows=data.map(r=>[r.id,r.data]);if(cacheable)cacheSet(key,rows);return rows;
  }
  const toSnap=rows=>{const docs=rows.map(([id,d])=>snapDoc(id,d));return{docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}}};
  return{
    where:(fl,op,v)=>sbQuery(t,[...f,[fl,op,v]],ord,lim),
    orderBy:(fl,d)=>sbQuery(t,f,[fl,d||'asc'],lim),
    limit:n=>sbQuery(t,f,ord,n),
    get:async()=>toSnap(await run()),
    onSnapshot(next,err){
      const c=isOrd?(()=>{const x=ordCacheLoad();return x&&[...x.rows]})():cacheable&&cacheGet(key);if(c)setTimeout(()=>next(toSnap(c)));
      const s={run:async()=>{try{next(toSnap(await run()))}catch(e){if(e.code!=='unavailable')err?.(e)}}};
      subs.add(s);s.run();return()=>subs.delete(s);
    },
    doc:id=>sbDoc(t,id||newId()),
    add:async d=>{const r=sbDoc(t,newId());await r.set(d);return r}
  };
}
function sbDoc(t,id){
  const key=JSON.stringify([t,'doc',id]),cacheable=t==='config';
  async function read(){const{data,error}=await sb.from(t).select('data').eq('id',id).maybeSingle();if(error)throw dbErr(error);const d=data?.data||null;if(cacheable)cacheSet(key,d);return d}
  return{id,path:t+'/'+id,
    get:async()=>snapDoc(id,await read()),
    async set(d){
      let r;
      if(APPEND_ONLY.has(t)){r=await sb.from(t).insert({id,data:d});if(r.error?.code==='23505')r={error:null}}
      else r=await sb.from(t).upsert({id,data:d});

    },
    async update(p){const cur=await read();if(!cur)throw{code:'invalid_argument',message:'documento inesistente'};
      const{error}=await sb.from(t).update({data:deepMerge(cur,p)}).eq('id',id);if(error)throw dbErr(error);refreshSoon()},
    async delete(){const{error}=await sb.from(t).delete().eq('id',id);if(error)throw dbErr(error);refreshSoon()},
    onSnapshot(next,err){
      const c=cacheable?cacheGet(key):null;if(c)setTimeout(()=>next(snapDoc(id,c)));
      const s={run:async()=>{try{next(snapDoc(id,await read()))}catch(e){if(e.code!=='unavailable')err?.(e)}}};
      subs.add(s);s.run();return()=>subs.delete(s);
    }
  };
}

const sbDownloads={async save({filename,data}){
  const b=data instanceof Blob?data:new Blob([data]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);return{status:'saved'};
}};
/* link firmati alle foto (privati, validi 1 ora) */
const fotoUrls=new Map(),fotoPend=new Set();let fotoT;
setInterval(()=>fotoUrls.clear(),50*60e3);
function fotoA(id){
  if(!id)return'';const u=fotoUrls.get(id);
  if(u)return`<a href="${esc(u)}" target="_blank" rel="noopener">Apri</a>`;
  if(u==='')return'<span class="mute">n.d.</span>';
  fotoPend.add(id);clearTimeout(fotoT);fotoT=setTimeout(loadFotoUrls,60);return'<span class="mute">…</span>';
}
async function loadFotoUrls(){
  const ids=[...fotoPend].filter(i=>!fotoUrls.has(i));fotoPend.clear();if(!ids.length||!sb)return;
  try{const{data,error}=await sb.storage.from('foto').createSignedUrls(ids,3600);if(error)throw error;
    for(const i of ids)fotoUrls.set(i,'');for(const r of data||[])if(r.path&&r.signedUrl&&/^https:\/\//.test(r.signedUrl))fotoUrls.set(r.path,r.signedUrl);render()}catch(e){console.warn(e)}
}
/* utenti (pagina Dati, solo responsabile) */
async function loadUtenti(){
  try{const{data,error}=await sb.from('profili').select('id,nome,ruolo,attivo').order('nome');if(error)throw error;S.utenti=data}catch(e){S.utenti=S.utenti||[]}
  render();
}
function vUtenti(){
  const u=S.utenti;if(!u)return'<div class="card">Caricamento utenti…</div>';
  return`<div class="card"><h2>Utenti</h2>
   <form id="nuovoU" class="grid" style="margin:10px 0 18px;align-items:end">
    <div><label for="nuN">Nome utente</label><input id="nuN" type="text" autocapitalize="none" spellcheck="false" placeholder="es. mario" required></div>
    <div><label for="nuP">PIN (6+ cifre)</label><input id="nuP" type="password" inputmode="numeric" autocomplete="new-password" required></div>
    <div><label for="nuR">Ruolo</label><select id="nuR"><option value="operatore">Operatore</option><option value="lettore">Lettura</option><option value="admin">Responsabile</option></select></div>
    <div><button class="red" id="nuB" ${S.uBusy?'disabled':''}>${S.uBusy?'Creazione…':'Crea utente'}</button></div></form>
   <div class="scroll"><table class="stack"><thead><tr><th>Nome utente</th><th>Ruolo</th><th>Attivo</th><th>PIN</th></tr></thead><tbody>
   ${u.map(p=>`<tr><td><b>${esc(p.nome)}</b>${p.id===S.me.id?' <span class="mute">(tu)</span>':''}</td>
     <td><select data-uruolo="${esc(p.id)}" aria-label="Ruolo di ${esc(p.nome)}" ${p.id===S.me.id?'disabled':''}>${[['operatore','Operatore'],['lettore','Lettura'],['admin','Responsabile']].map(([v,l])=>`<option value="${v}" ${p.ruolo===v?'selected':''}>${l}</option>`).join('')}</select></td>
     <td><label class="check" style="margin:0"><input type="checkbox" data-uattivo="${esc(p.id)}" ${p.attivo?'checked':''} ${p.id===S.me.id?'disabled':''}> ${p.attivo?'Sì':'No'}</label></td>
     <td>${p.id===S.me.id?'<span class="mute">usa "Cambia PIN"</span>':`<button class="ghost" data-upin="${esc(p.id)}" data-unome="${esc(p.nome)}" style="min-height:36px;padding:4px 10px">Nuovo PIN</button>`}</td></tr>`).join('')}
   </tbody></table></div></div>`;
}
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.uruolo||t.dataset.uattivo){const id=t.dataset.uruolo||t.dataset.uattivo,patch=t.dataset.uruolo?{ruolo:t.value}:{attivo:t.checked};
    const{error}=await sb.from('profili').update(patch).eq('id',id);if(error)toast('Modifica non salvata.',true);else toast('Utente aggiornato.');loadUtenti()}
});
async function gestioneUtenti(body){
  const{data,error}=await sb.functions.invoke('gestione-utenti',{body:{...body,domain:CFG.domain}});
  if(!error)return data;
  let msg='';try{msg=(await error.context.json()).error}catch{}
  if(!msg)msg=/not found|404|Failed to send/i.test(String(error.message))?'La funzione "gestione-utenti" non è ancora installata su Supabase (vedi LEGGIMI.md).':'Operazione non riuscita: '+error.message;
  throw new Error(msg);
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='nuovoU')return;e.preventDefault();
  const nome=$('#nuN').value.trim().toLowerCase(),pin=$('#nuP').value.trim(),ruolo=$('#nuR').value;
  if(!/^[a-z0-9._-]{2,30}$/.test(nome)){toast('Nome utente: solo lettere minuscole, numeri, punto o trattino.',true);return}
  if(!/^\d{6,12}$/.test(pin)){toast('Il PIN deve avere da 6 a 12 cifre.',true);return}
  S.uBusy=true;render();
  try{await gestioneUtenti({azione:'crea',nome,pin,ruolo});toast(`Utente ${nome} creato.`);$('#nuN').value='';$('#nuP').value='';loadUtenti()}
  catch(err){toast(err.message,true)}
  S.uBusy=false;render();
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-upin]');if(!b)return;
  const i=$('#dlgI');i.type='password';i.inputMode='numeric';
  const v=await ask('Nuovo PIN per '+b.dataset.unome,'Scrivi il nuovo PIN (6-12 cifre) e comunicalo alla persona.',true);i.type='text';i.inputMode='';
  if(!v)return;if(!/^\d{6,12}$/.test(v)){toast('Il PIN deve avere da 6 a 12 cifre.',true);return}
  try{await gestioneUtenti({azione:'pin',id:b.dataset.upin,pin:v});toast('PIN aggiornato.')}catch(err){toast(err.message,true)}
});
/* login */
function showLogin(msg){
  $('#nav').innerHTML='';$('#me').textContent='';$('#role').classList.add('hidden');$('#hdrBtns').classList.add('hidden');
  $('#view').innerHTML=`<div class="card login fade"><h2>Accedi</h2>${msg?`<div class="msg err">${esc(msg)}</div>`:''}
   <form id="loginF"><label for="lgU">Nome utente (o email)</label><input id="lgU" type="text" class="big" autocomplete="username" autocapitalize="none" spellcheck="false" required>
   <label for="lgP">PIN</label><input id="lgP" type="password" class="big" inputmode="numeric" autocomplete="current-password" required>
   <button class="red" id="lgB" style="margin-top:18px;width:100%">Entra</button></form></div>`;
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='loginF')return;e.preventDefault();
  const u=$('#lgU').value.trim().toLowerCase().replace(/\s+/g,''),p=$('#lgP').value.trim();$('#lgB').disabled=true;
  const{data,error}=await sb.auth.signInWithPassword({email:u.includes('@')?u:`${u}@${CFG.domain}`,password:p});
  if(error)return showLogin(navigator.onLine?'Nome utente o PIN errati.':'Nessuna connessione: per il primo accesso serve la rete.');
  startApp(data.user);
});
async function logout(){
  if(S.outbox.length&&!await ask('Uscire?',`Ci sono ${S.outbox.length} salvataggi non ancora inviati: uscendo andranno persi.`))return;
  await sb.auth.signOut();try{for(const k of Object.keys(localStorage))if(k.startsWith('pzc:'))localStorage.removeItem(k)}catch{}
  location.reload();
}
async function cambiaPin(){
  const i=$('#dlgI');i.type='password';i.inputMode='numeric';
  const v=await ask('Cambia PIN','Scrivi il nuovo PIN (almeno 6 cifre).',true);i.type='text';i.inputMode='';
  if(!v)return;if(!/^\d{6,}$/.test(v)){toast('Il PIN deve avere almeno 6 cifre.',true);return}
  const{error}=await sb.auth.updateUser({password:v});toast(error?'PIN non cambiato: riprova.':'PIN cambiato.',!!error);
}

async function boot(){
  if(!CFG.url||!CFG.key||!window.supabase){$('#view').innerHTML='<div class="card msg err">Configurazione mancante: compila il file config.js con indirizzo e chiave di Supabase.</div>';$('#me').textContent='';return}
  sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return showLogin();
  startApp(session.user);
}
let started=false;
async function startApp(user){
  if(started)return;
  let prof=null;
  try{const{data,error}=await sb.from('profili').select('id,nome,ruolo,attivo').eq('id',user.id).maybeSingle();if(error)throw error;prof=data;if(prof)cacheSet('prof:'+user.id,prof)}
  catch{prof=cacheGet('prof:'+user.id)}
  $('#hdrBtns').classList.remove('hidden');
  if(!prof||!prof.attivo){$('#me').textContent='';$('#view').innerHTML='<div class="card msg err">Il tuo utente non è attivo. Chiedi al responsabile.</div>';return}
  started=true;
  S.db=sbDb;S.user=sbUser(prof);S.assets=prof.ruolo==='lettore'?null:sbAssets;S.downloads=sbDownloads;S.sample=null;
  S.me={id:prof.id,name:prof.nome};
  S.role=prof.ruolo==='admin'?'admin':prof.ruolo==='lettore'?'lettore':'operatore';
  if(S.role==='lettore')showDiag();
  $('#me').textContent=S.me.name||'Utente';const rb=$('#role');rb.textContent={admin:'Responsabile',lettore:'Lettura',operatore:'Operatore'}[S.role];rb.classList.remove('hidden');
  const tm=setTimeout(()=>{if(!S.ordLoaded)$('#view').innerHTML='<div class="card msg err">Il database non risponde. Controlla la connessione e riapri la pagina.</div>'},12000);
  S.db.collection('ordini').onSnapshot(s=>{clearTimeout(tm);S.ordini=new Map(s.docs.map(d=>[d.id,d.data()]));S.ordLoaded=true;if(S.sel)S.sel=S.ordini.get(S.sel.odp)||S.sel;render()},()=>{clearTimeout(tm);S.ordLoaded=true;render()});
  S.db.doc('config/impostazioni').onSnapshot(d=>{S.cfg={fotoObbligatoria:false,...(d.data()||{})};render()},()=>{});
  S.db.doc('config/compat').onSnapshot(d=>{S.compat=d.data()?.coppie||[];render()},()=>{});
  S.db.doc('config/import').onSnapshot(d=>{const n=d.data()||null;if(S.lastImp&&n&&n.tsMs!==S.lastImp.tsMs){S.ordForce=true;refreshSoon()}S.lastImp=n;render()},()=>{});
  obLoad();setTimeout(flush,1500);
  subPunz();
  subCtrl();
  render();
}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
}
</script>
</body>
